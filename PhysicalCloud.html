<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Physical Cloud</title>
  <link rel="stylesheet" href="PhysicalCloud.css">
</head>
<body>

  <div class="app">

    <aside class="sidebar">
      <div class="sidebar-logo">
        <svg class="logo-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M6.5 18.5C4.01 18.5 2 16.49 2 14C2 11.76 3.64 9.9 5.79 9.56C6.32 7.22 8.41 5.5 10.9 5.5C13.61 5.5 15.85 7.49 16.22 10.08C18.36 10.36 20 12.18 20 14.4C20 16.81 18.04 18.77 15.63 18.77H6.5V18.5Z" fill="currentColor"/>
        </svg>
        <span class="logo-text">Physical<span class="accent">Cloud</span></span>
      </div>

      <nav class="sidebar-nav">
        <button class="nav-item active" data-tab="dispositivos">Dispositivos conectados</button>
        <button class="nav-item" data-tab="nuvem">Nuvem</button>
      </nav>
    </aside>

   
    <main class="content">

      
      <section id="dispositivos" class="tab-panel active">
        <h1>Dispositivos conectados</h1>
        <p class="subtitle">Conecte um celular, computador ou notebook para começar a trocar arquivos.</p>

        <div class="empty-state">
          <p>Nenhum dispositivo conectado ainda.</p>
          <button class="primary-btn" id="btn-conectar">Conectar dispositivo</button>
        </div>
      </section>

      
      <section id="nuvem" class="tab-panel">
        <h1>Nuvem</h1>
        <p class="subtitle">Seus arquivos enviados aparecem aqui.</p>

        <div class="empty-state">
          <p>Nenhum arquivo enviado ainda.</p>
          <button class="primary-btn" id="btn-enviar">Enviar arquivo</button>
        </div>
      </section>

    </main>

  </div>

  <script src="script.js"></script>
</body>
</html>
